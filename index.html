<style>
/* Layout : barre fixe (retour, recherche) ; accueil = recherche, accès direct, 4 portes, favoris ; document = fil d'Ariane, sommaire, L'essentiel ouvert, Le détail en sections dépliables */
:root{

  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --fs:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141B; --panel:#181E28; --ink:#E6EAF0; --mute:#9AA4B3; --line:#2B3442; --soft:#212938; --mark:#6B5A12;
  --p1:#F27AB8; --p2:#7FB2F0; --p3:#E2B85A; --p4:#3CC7B2; --acc:#E6EAF0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141B; --panel:#181E28; --ink:#E6EAF0; --mute:#9AA4B3; --line:#2B3442; --soft:#212938; --mark:#6B5A12;
  --p1:#F27AB8; --p2:#7FB2F0; --p3:#E2B85A; --p4:#3CC7B2; --acc:#E6EAF0; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1100px;margin:0 auto;padding-block:8px;padding-inline:16px;display:flex;gap:8px;align-items:center}
.ib{min-width:40px;min-height:40px;border:1px solid var(--line);background:var(--panel);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;padding:0 10px;white-space:nowrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.01em;white-space:nowrap;text-decoration:none}
.sbox{flex:1;min-width:0;position:relative}

.sbox svg{position:absolute;left:10px;top:11px;width:18px;height:18px;stroke:var(--mute)}
main{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px 60px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
.lead{color:var(--mute);margin:4px 0 0}
.sec{margin-top:22px}
.sec>h2{font-family:var(--display);font-size:21px;font-weight:700;margin:0 0 8px}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.doors{grid-template-columns:minmax(0,1fr)}}
.door{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:4px solid var(--pc)}
.door b{font-family:var(--display);font-size:24px;color:var(--pc);line-height:1.1}

.quick{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}

.dochead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start;margin-top:6px}

.doc .ess h2{margin-top:12px}
.doc details{border-top:1px solid var(--line);padding:2px 0}

.doc th,.doc td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.doc th{background:var(--soft);font-weight:600}

.ref{color:var(--pc);font-weight:600;text-decoration:none;border-bottom:1px dotted currentColor}
.bq,.ex{font-family:var(--ui);font-size:.82em;background:var(--soft);border-radius:5px;padding:1px 5px;white-space:nowrap}
mark{background:var(--mark);color:inherit;border-radius:2px}
.frw{overflow-x:auto;margin:10px 0 4px;background:#fff;border-radius:10px;border:1px solid var(--line)} .frise{display:block;min-width:720px;width:100%;height:auto}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--ui);font-size:12px;margin:4px 0} .leg span{display:inline-flex;align-items:center;gap:5px} .leg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.lc{font-family:var(--ui);font-size:11px;font-weight:700;border-radius:5px;padding:1px 5px;margin-right:2px;white-space:nowrap} .lc.pp{color:#C2410C;background:#FFF1E8} .lc.ge{color:#1D4ED8;background:#EAF0FF} .lc.de{color:#0F766E;background:#E6F6F3}
.doc table.wk{width:100%;font-size:.86em} .doc table.wk td{padding:6px 8px} .doc table.wk td.sl{width:7.5em;border-left:4px solid var(--c)} .doc table.wk td.sl small{color:var(--mute);font-size:.86em}
.doc tr.pp{--c:#C2410C} .doc tr.pp td{background:#FFF8F3} .doc tr.tb{--c:#1D4ED8} .doc tr.tb td{background:#F4F7FF} .doc tr.ten{--c:#475569} .doc tr.ten td{background:#F6F8FA} .doc tr.pm{--c:#7C3AED} .doc tr.pm td{background:#F8F5FF}
.doc tr td div{margin-top:3px} .doc b.tour{color:#B91C1C}
.doc h4{display:flex;flex-wrap:wrap;gap:6px;align-items:center} .chg{display:inline-flex;gap:2px;margin-left:4px} .chg b{width:9px;height:9px;border-radius:2px;border:1px solid var(--pc);display:inline-block} .chg b.on{background:var(--pc)}
.wf{font-family:var(--ui);font-size:13px;margin:0 0 6px} .fl{border-radius:999px;padding:2px 8px;font-weight:600;font-size:12px;margin-right:4px} .fl.t{background:#FDECEC;color:#B91C1C} .fl.v{background:#FEF3C7;color:#8A5A00} .fl.b{background:#E6F6F3;color:#0F766E}
.off{font-family:var(--ui);color:var(--mute);background:var(--soft);border-radius:8px;padding:8px 12px}

.stb{border-radius:8px;padding:8px 6px;font-size:12.5px;font-weight:600;border:1.5px solid} .stb.pp{color:#C2410C;background:#FFF1E8} .stb.tb{color:#1D4ED8;background:#EAF0FF} .stb.ten{color:#334155;background:#EEF1F5} .stb.pm{color:#7C3AED;background:#F3EEFF} .stb.rp{color:var(--mute);background:var(--soft);border-color:var(--line)}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px} .jump a,.jump button{font-size:13.5px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer}

.doc details,.doc h4,.doc h5,.doc tr,.doc mark{scroll-margin-top:78px}
.flash{animation:fl 1.6s ease}

.pn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:26px}

.notes{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}

.tools{display:flex;flex-wrap:wrap;gap:8px}
.msg{font-size:13.5px;color:var(--mute)}
.load{padding:40px 0;color:var(--mute)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}

.doc{--pc:#2B6CB0}

<script>
"use strict";
/* ===== MiniPDF : vrai fichier PDF fabriqué sur l'appareil, sans bibliothèque (Helvetica, A4) ===== */
const MiniPDF = (()=>{
  const CP = {"€":128,"‚":130,"ƒ":131,"„":132,"…":133,"†":134,"‡":135,"ˆ":136,"‰":137,"Š":138,"‹":139,"Œ":140,"Ž":142,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151,"˜":152,"™":153,"š":154,"›":155,"œ":156,"ž":158,"Ÿ":159};
  const SUB = {"→":"->","←":"<-","≤":"<=","≥":">=","✓":"OK","★":"*","ⓘ":"i","✎":""," ":" "," ":" ","‑":"-","≈":"~","×":"×","…":"…","Δ":"D","°":"°"};
  function enc(s){ let o=""; for(const ch of String(s??"")){ let c=ch; if(c.charCodeAt(0)>255 && !(c in CP) && SUB[c]!=null) c=SUB[c]; for(const k of c){ const n=k.charCodeAt(0); if(n<256) o+=k; else if(CP[k]) o+=String.fromCharCode(CP[k]); else o+="?"; } } return o.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); }
  let ctx=null;
  function width(s,size,bold){ if(!ctx){ ctx=document.createElement("canvas").getContext("2d"); } ctx.font=(bold?"bold ":"")+"100px Helvetica, Arial, sans-serif"; return ctx.measureText(String(s)).width/100*size*1.02; }
  function hex(c){ const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c||"#000000"); return m?[1,2,3].map(i=>(parseInt(m[i],16)/255).toFixed(3)).join(" "):"0 0 0"; }
  class Doc{
    constructor(opt={}){ this.W=opt.landscape?842:595; this.H=opt.landscape?595:842; this.M=opt.margin||36; this.pages=[]; this.addPage(); }
    addPage(){ this.cur=[]; this.pages.push(this.cur); this.y=this.M; return this; }
    text(x,y,s,o={}){ const sz=o.size||10; this.cur.push(`BT /${o.bold?"F2":"F1"} ${sz} Tf ${hex(o.color)} rg ${x.toFixed(2)} ${(this.H-y-sz*0.8).toFixed(2)} Td (${enc(s)}) Tj ET`); }
    rect(x,y,w,h,o={}){ const c=[]; if(o.fill) c.push(hex(o.fill)+" rg"); if(o.stroke) c.push(hex(o.stroke)+" RG "+(o.lw||0.6)+" w"); c.push(`${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${o.fill&&o.stroke?"B":o.fill?"f":"S"}`); this.cur.push(c.join(" ")); }
    line(x1,y1,x2,y2,o={}){ this.cur.push(`${hex(o.color||"#C8CDD4")} RG ${o.lw||0.6} w ${x1.toFixed(2)} ${(this.H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H-y2).toFixed(2)} l S`); }
    wrap(s,size,maxw,bold){ const out=[]; for(const para of String(s??"").split("\n")){ let line=""; for(const w of para.split(/\s+/)){ if(!w) continue; const t=line?line+" "+w:w; if(width(t,size,bold)<=maxw||!line) line=t; else { out.push(line); line=w; } } out.push(line); } return out; }
    need(h){ if(this.y+h>this.H-this.M) { this.addPage(); return true; } return false; }
    /* paragraphe avec retour à la ligne et saut de page automatique */
    para(s,o={}){ const sz=o.size||10, lh=sz*(o.lh||1.3), x=o.x??this.M, w=o.w??(this.W-this.M-x); for(const l of this.wrap(s,sz,w,o.bold)){ this.need(lh); this.text(x,this.y,l,o); this.y+=lh; } this.y+=o.after??2; }
    out(){
      const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
      add("<< /Type /Catalog /Pages 2 0 R >>"); add("PAGES");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
      const kids=[];
      for(const p of this.pages){ const st=p.join("\n"); const c=add(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`); kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${c} 0 R >>`)); }
      objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
      let s="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"; const off=[];
      objs.forEach((o,i)=>{ off.push(s.length); s+=`${i+1} 0 obj\n${o}\nendobj\n`; });
      const x=s.length; s+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
      const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i)&255; return new Blob([b],{type:"application/pdf"});
    }
  }
  /* remise du fichier : feuille de partage (Imprimer, Enregistrer dans Fichiers…) sinon téléchargement */
  async function deliver(blob,name){
    const file=new File([blob],name,{type:"application/pdf"});
    try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return "share"; } }catch(e){ if(e && e.name==="AbortError") return "abort"; }
    const u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=name; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
    return "download";
  }
  return {Doc, deliver, width};
})();

/* ===== ROUTINES D'ÉCHAUFFEMENT ADAPTABLES : la méthode construit les blocs, le joueur choisit ses jeux ===== */
const RK="routines_v1", JK="grilles_joueurs_v1", PK="programmation_v1";
let DATA=null, G={};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const todayIso=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const frD=s=>s?s.split("-").reverse().join("/"):"";
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function load(k,def){ try{ return JSON.parse(localStorage.getItem(k))||def; }catch(e){ return def; } }
let ST=load(RK,{routines:[],hist:[],last:null,mat:null}); for(const k of ["routines","hist","hide","fav"]) if(!Array.isArray(ST[k])) ST[k]=[];
function saveNow(){ try{ localStorage.setItem(RK,JSON.stringify(ST)); }catch(e){} }
const joueurs=()=>{ const j=load(JK,{joueurs:[]}); return Array.isArray(j.joueurs)?j.joueurs:[]; };
const profils=()=>load(PK,{profils:{}}).profils||{};
function ageAt(nai){ if(!nai) return null; const a=new Date(nai),r=new Date(); let y=r.getFullYear()-a.getFullYear(); if(r.getMonth()<a.getMonth()||(r.getMonth()===a.getMonth()&&r.getDate()<a.getDate())) y--; return y; }
const main=$("#main");

/* ---------- référentiels ---------- */
const ET={MR:{n:"Mise en route",c:"#C2410C",w:1.3},MO:{n:"Mobilité",c:"#0F766E",w:1},AC:{n:"Activation et prévention",c:"#7C3AED",w:1},CV:{n:"Coordination et vitesse",c:"#1D4ED8",w:1},ST:{n:"Spécifique tennis",c:"#B7791F",w:1.4},PO:{n:"Mise en tension finale",c:"#B91C1C",w:0.6}};
const ORD=["MR","MO","AC","CV","ST","PO"];
const APRES={tennis:"Entraînement tennis",pp:"Séance de PP",match:"Match",bilan:"Bilan / tests"};
const PRIO={tennis:["MR","ST","MO","CV","AC","PO","ST"],pp:["MR","MO","AC","CV","PO","AC","MO"],match:["MR","ST","PO","MO","CV","AC","ST"],bilan:["MR","MO","CV","AC","PO","CV","MO"]};
const fmn=m=>{ const a=Math.floor(m), s=Math.round((m-a)*60); return a+(s?" min "+s:" min"); };
const DUREES=[5,10,15,20,30,45], NB={5:2,10:3,15:4,20:5,30:6,45:7};
const LIEUX={court:"Court",salle:"Salle, gymnase",ext:"Extérieur",bord:"Bord de court, allée de club",hotel:"Chambre d'hôtel, couloir"};
const SURF={terre:"Terre battue",dur:"Dur",indoor:"Indoor"};
const MAT=[["rb","Raquette et balles"],["plots","Plots, coupelles"],["lattes","Lattes"],["echelle","Échelle de rythme"],["cerceaux","Cerceaux"],["haies","Haies basses"],["corde","Corde à sauter"],["mb","Médecine-ball"],["ballon","Ballon"],["elast","Élastique"],["banc","Banc, marche"],["mur","Mur"],["cibles","Cibles"],["chasubles","Chasubles"],["tapis","Tapis"]];
const MATN=Object.fromEntries(MAT);
const FORME={frais:"En forme",fatigue:"Fatigué",courba:"Courbaturé",douleur:"Petite douleur"};
const METEO={froid:"Froid",normal:"Normal",chaud:"Chaud"};
const ZN={dos:"Dos",genou:"Genou",talon:"Talon, cheville",epaule:"Épaule",poignet:"Poignet, coude",hanche:"Hanche"};
const ZR={dos:/charni|lest|medecine|lancer lourd|rotation forte|cambr|extension/,genou:/saut|bond|pliom|reception|fente|squat|freinage|accroupi/,talon:/saut|bond|pliom|sautill|corde|sprint|cloche-pied/,epaule:/lancer|medecine|smash|service|pompe|bras tendus au-dessus/,poignet:/appui sur les mains|pompe|medecine|quadrup|brouette|crabe/,hanche:/fente|ecart|grand pas|charni/};
const ZPREV={dos:/dos|lomb|bassin|tronc|gainage/,genou:/genou/,talon:/pied|cheville|mollet|talon/,epaule:/epaule|omoplate|coiffe/,poignet:/poignet|avant-bras|coude/,hanche:/hanche|fessier|bassin/};

/* ---------- construction de la routine ---------- */
/* cibles de chaque étape : un bloc complet les couvre toutes */
const CIB={MR:[["cardio","Élever la température"],["appuis","Appuis légers"],["gammes","Gammes et courses variées"]],
 MO:[["chevilles","Chevilles et pieds"],["hanches","Hanches"],["tronc","Colonne et tronc"],["epaules","Épaules"],["poignets","Poignets et avant-bras"]],
 AC:[["fessiers","Fessiers et bassin"],["gainage","Gainage"],["epaule","Épaule de frappe"],["genou_cheville","Genoux et chevilles"]],
 CV:[["rythme","Rythme d'appuis"],["reaction","Réaction"],["direction","Changements de direction"],["vitesse","Vitesse"]],
 ST:[["fond","Fond de court"],["deplacements","Déplacements tennis"],["filet","Filet et toucher"],["service_retour","Service et retour"]],
 PO:[["jambes","Jambes explosives"],["haut","Bras et frappe vifs"],["mental","Activation mentale"]]};
const CIBN=Object.fromEntries(Object.values(CIB).flat());
const SEC={MR:70,MO:35,AC:40,CV:35,ST:70,PO:25}, CAP={MR:4,MO:6,AC:5,CV:5,ST:5,PO:3};
const ZT={genou:"genou_cheville",talon:"genou_cheville",epaule:"epaule",poignet:"epaule",dos:"gainage",hanche:"fessiers"};
function ciblesOrdre(et,r){
  let T=CIB[et].map(x=>x[0]);
  if(et==="ST") T= r.apres==="match"?["service_retour","fond","deplacements","filet"]: r.apres==="tennis"?["fond","deplacements","filet","service_retour"]:["deplacements","fond","filet","service_retour"];
  if(et==="PO" && r.apres==="bilan") T=["jambes","mental","haut"];
  if(et==="AC"){ const z=[r.forme==="douleur"?r.zone:null,...ctxPlayer(r).zones].filter(Boolean).map(x=>ZT[x]).filter(Boolean); T=[...new Set([...z,...T])]; }
  return T;
}
function slotsPour(b,r){
  const n=Math.max(1,Math.min(CAP[b.et],Math.round(b.min*60/SEC[b.et]))), T=ciblesOrdre(b.et,r), S=[];
  if(n>=T.length){ for(let i=0;i<n;i++) S.push([T[i%T.length]]); }
  else { const base=Math.floor(T.length/n); let rest=T.length%n, a=0; for(let i=0;i<n;i++){ const k=base+(rest-->0?1:0); S.push(T.slice(a,a+k)); a+=k; } }
  const old=b.slots||[];
  return S.map((t,i)=>({t, g: old[i]&&old[i].t.join()===t.join()?old[i].g:null}));
}
function blocsPour(c){
  const nb=c.nb||NB[c.duree]||3; const pr=PRIO[c.apres]||PRIO.tennis;
  const pick=pr.slice(0,nb), cnt={};
  const list=ORD.flatMap(e=>pick.filter(x=>x===e)).map(e=>{ cnt[e]=(cnt[e]||0)+1; return {et:e,k:cnt[e]}; });
  let w=list.map(b=>ET[b.et].w*(b.et==="MR"?(c.meteo==="froid"?1.5:c.meteo==="chaud"?0.75:1):1)*(b.et==="PO"&&(c.forme==="fatigue"||c.forme==="courba")?0.7:1));
  const W=w.reduce((a,b)=>a+b,0);
  list.forEach((b,i)=>{ b.min=Math.max(1,Math.round(c.duree*w[i]/W*2)/2); });
  const diff=c.duree-list.reduce((a,b)=>a+b.min,0); if(list.length) list[Math.max(0,list.findIndex(b=>b.et==="MR"))].min+=diff;
  list.forEach(b=>b.slots=slotsPour(b,c));
  return list;
}
function migrate(r){ for(const b of r.blocks) if(!b.slots){ b.slots=slotsPour(b,r); if(b.g&&b.slots[0]) b.slots[0].g=b.g; delete b.g; } }
const allG=r=>r.blocks.flatMap(b=>b.slots.map(s=>s.g)).filter(Boolean);
function fmtOf(n){ return n<=1?"seul":n===2?"deux":"groupe"; }
function ctxPlayer(r){
  const J=joueurs(), P=profils();
  if(r.jids?.length){ const sel=J.filter(j=>r.jids.includes(j.id)); const ages=sel.map(j=>ageAt(j.naissance)).filter(a=>a!=null);
    const z=new Set(r.zones||[]); let cr=false; sel.forEach(j=>{ (P[j.id]?.zones||[]).forEach(x=>z.add(x)); if(P[j.id]?.croissance) cr=true; });
    return {age:ages.length?Math.min(...ages):(r.age||12), zones:[...z], crois:cr}; }
  return {age:r.age||12, zones:r.zones||[], crois:false};
}
function candidats(r,b,slot,used){
  const p=ctxPlayer(r), fmt=fmtOf(r.n||1), mat=new Set(r.mat||[]), hist=recentMap(r), S=slot.t, sec=b.min*60/b.slots.length;
  const out=[];
  for(const g of DATA.g){
    if(g.et!==b.et || ST.hide.includes(g.id)) continue;
    const cov=(g.ci||[]).filter(x=>S.includes(x)).length;
    if(!cov && !(g.complet&&S.length>1)) continue;
    if(g.complet && S.length===1 && b.slots.length>1) continue;
    if(p.age<g.a[0]||p.age>g.a[1]) continue;
    if(!g.lieu.includes(r.lieu)) continue;
    if(g.mat.some(m=>!mat.has(m))) continue;
    const okF=g.fmt.includes(fmt)||g.fmt.includes("seul");
    if(!okF) continue;
    let s=4*cov/S.length; const t=norm(g.n+" "+g.but+" "+g.de);
    if(g.complet) s+= S.length>=3?4:S.length===2?1.5:-1.5;
    if(!g.complet && S.length===1 && (g.ci||[]).length===1) s+=0.8;
    if(g.fmt.includes(fmt)) s+=1.5;
    if(g.apres.includes(r.apres)) s+=1.5;
    if(g.src==="new") s+=1.2;
    if(sec<50 && g.dur>=5 && !g.complet) s-=0.8;
    const mid=(g.a[0]+g.a[1])/2; s-=Math.abs(p.age-mid)*0.12;
    if(r.forme==="fatigue"||r.forme==="courba"){ if(g.int===3) s-=2; }
    const zs=r.forme==="douleur"&&r.zone?[r.zone,...p.zones]:p.zones;
    for(const z of zs){ if(ZR[z]?.test(t)) s-=5; if(b.et==="AC"&&ZPREV[z]?.test(t)) s+=2; }
    if(p.crois && /saut|bond|pliom|reception/.test(t) && g.int===3) s-=3;
    if(ST.fav.includes(g.id)) s+=3;
    const bm=new Set(b.slots.filter(x=>x!==slot&&x.g&&G[x.g]).flatMap(x=>G[x.g].mat));
    if(!g.mat.length) s+=0.4; else if(g.mat.every(m=>bm.has(m))) s+=1;
    out.push({g,s,last:hist[g.id]||null,used:used.has(g.id)});
  }
  return out.sort((x,y)=>(x.used-y.used)||(y.s-x.s));
}
function recentMap(r){ const m={}; const who=r.jids?.[0]||"invite"; for(const h of ST.hist) if(h.who===who) for(const id of h.g) if(!m[id]||m[id]<h.date) m[id]=h.date; return m; }
function surprise(r,onlyEmpty){
  const used=new Set(onlyEmpty?allG(r):[]); const cut=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  for(const b of r.blocks) for(const s of b.slots){ if(onlyEmpty&&s.g) continue; s.g=null;
    const C=candidats(r,b,s,used).filter(x=>!x.used); const top=C.slice(0,8); const fresh=top.filter(x=>!x.last||x.last<cut); const pool=fresh.length?fresh:top;
    if(!pool.length) continue; const x=pool[Math.floor(Math.random()*pool.length)]; s.g=x.g.id; used.add(x.g.id); }
}

/* ---------- navigation ---------- */
function go(h){ if(location.hash===h) route(); else location.hash=h; }
$("#back").onclick=()=>{ if(history.length>1) history.back(); else go("#"); };
const sheet=$("#sheet");
function openSheet(html){ sheet.innerHTML=`<div class="shin" role="dialog" aria-modal="true">${html}</div>`; sheet.hidden=false; document.body.classList.add("noscroll"); $$("[data-close]",sheet).forEach(b=>b.onclick=closeSheet); }
function closeSheet(){ sheet.hidden=true; sheet.innerHTML=""; document.body.classList.remove("noscroll"); }
sheet.addEventListener("click",e=>{ if(e.target===sheet) closeSheet(); });
let DRAFT=null;
function newDraft(mode){ const L=ST.last||{}; return {id:uid(),mode,nom:"",date:todayIso(),jids:[],age:L.age||12,sexe:"F",apres:"tennis",sous:"",duree:10,lieu:L.lieu||"court",surface:L.surface||"dur",n:1,mat:ST.mat||["rb"],meteo:"normal",forme:"frais",zone:"",delai:0,blocks:[]}; }

/* ---------- ACCUEIL ---------- */
function showHome(){
  const saved=ST.routines.slice().sort((a,b)=>(b.maj||"")<(a.maj||"")?-1:1);
  main.innerHTML=`<h1>Routines d'échauffement</h1><p class="lead">Dis-nous ce qui t'attend, la méthode construit ton échauffement bloc par bloc, et tu choisis tes jeux.</p>
  <div class="big2"><a class="bigb jb" href="#j/0"><b>Je suis joueur</b><span>5 questions et c'est parti</span></a><a class="bigb cb" href="#c"><b>Coach</b><span>Tous les réglages, plusieurs joueurs</span></a></div>
  ${saved.length?`<section class="sec"><h2>Routines enregistrées</h2><div class="list">${saved.map(r=>`<a class="li" href="#r/${r.id}"><span class="code">${r.duree} min</span><span class="tt">${esc(r.nom||"Routine")}<small>${APRES[r.apres]} · ${r.blocks.length} blocs · ${LIEUX[r.lieu]}</small></span></a>`).join("")}</div></section>`:""}
  ${ST.fav.length||ST.hide.length?`<section class="sec"><h2>Mes jeux</h2><a class="li solo" href="#m"><span class="code">♥ ${ST.fav.length}</span><span class="tt">Coups de cœur et jeux masqués<small>${ST.hide.length} jeu${ST.hide.length>1?"x":""} masqué${ST.hide.length>1?"s":""}</small></span></a></section>`:""}
  <section class="sec"><h2>Historique</h2>${histHtml()}</section>
  <section class="sec"><h2>Sauvegarde</h2><div class="tools"><button class="ib" id="exp" type="button">Sauvegarder</button><label class="ib">Restaurer<input type="file" id="imp" accept=".json,application/json" hidden></label></div><p class="msg" id="smsg">Tout reste sur cet appareil.</p></section>`;
  $("#exp").onclick=()=>{ saveNow(); const b=new Blob([JSON.stringify({format:"routines",date:todayIso(),st:ST},null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`Routines_${todayIso()}.json`; document.body.appendChild(a); a.click(); a.remove(); };
  $("#imp").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(d.format!=="routines") throw 0; ST=d.st; saveNow(); route(); }catch(x){ $("#smsg").textContent="Ce fichier n'est pas une sauvegarde de cette appli."; } }; rd.readAsText(f); };
  $$("[data-hj]").forEach(s=>s.onchange=()=>{ $$(".hrow").forEach(r=>r.hidden=s.value&&r.dataset.who!==s.value); });
}
function histHtml(){
  if(!ST.hist.length) return `<div class="empty">Aucun échauffement fait pour l'instant.</div>`;
  const J=joueurs(), who=[...new Set(ST.hist.map(h=>h.who))];
  const nm=w=>w==="invite"?"Invité":(J.find(j=>j.id===w)?.nom||"Joueur");
  return `<div class="f"><label for="hj">Joueur</label><select id="hj" data-hj><option value="">Tous</option>${who.map(w=>`<option value="${w}">${esc(nm(w))}</option>`).join("")}</select></div>
   <div class="list" style="margin-top:8px">${ST.hist.slice().reverse().slice(0,60).map(h=>`<div class="li hrow" data-who="${h.who}"><span class="code">${frD(h.date).slice(0,5)}</span><span class="tt">${esc(nm(h.who))} · ${h.duree} min avant ${esc((APRES[h.apres]||"").toLowerCase())}<small>${h.g.map(id=>esc(G[id]?.n||id)).join(" · ")}</small></span></div>`).join("")}</div>`;
}

/* ---------- MODE JOUEUR : une question par écran ---------- */
const JSTEPS=["qui","apres","duree","lieu","avec","mat","forme"];
function showJoueur(k){
  k=+k||0; if(k===0||!DRAFT||DRAFT.mode!=="j") DRAFT=DRAFT&&DRAFT.mode==="j"&&k>0?DRAFT:newDraft("j");
  const d=DRAFT, st=JSTEPS[k], J=joueurs();
  const head=`<div class="prog">${JSTEPS.map((_,i)=>`<i class="${i<=k?"on":""}"></i>`).join("")}</div>`;
  const nav=(okLabel="Suivant")=>`<div class="tools navj">${k?`<a class="ib" href="#j/${k-1}">‹ Retour</a>`:""}<button class="go big" id="nx" type="button">${okLabel}</button></div>`;
  const opt=(attr,val,lab,cur,sub="")=>`<button type="button" class="opt" data-${attr}="${val}" aria-pressed="${cur===val}"><b>${lab}</b>${sub?`<span>${sub}</span>`:""}</button>`;
  let body="";
  if(st==="qui") body=`<h1>Qui es-tu ?</h1><div class="opts">${J.map(j=>opt("jid",j.id,esc(j.nom),d.jids[0]||"",ageAt(j.naissance)!=null?ageAt(j.naissance)+" ans":"")).join("")}${opt("jid","invite","Invité","" + (d.jids[0]?"":"invite"),"je rentre mon âge")}</div>
    <div id="inv"${d.jids[0]?" hidden":""}><div class="row"><div class="f"><label for="ia">Âge</label><input type="number" id="ia" min="4" max="18" value="${d.age}" inputmode="numeric"></div><div class="f"><label for="is">Sexe</label><select id="is"><option value="F"${d.sexe==="F"?" selected":""}>Fille</option><option value="G"${d.sexe==="G"?" selected":""}>Garçon</option></select></div></div></div>`;
  if(st==="apres") body=`<h1>Qu'est-ce qui suit ?</h1><div class="opts">${Object.entries(APRES).map(([v,l])=>opt("ap",v,l,d.apres)).join("")}</div>`;
  if(st==="duree") body=`<h1>Combien de temps as-tu ?</h1><div class="opts g3">${DUREES.map(v=>opt("du",String(v),v+" min",String(d.duree),NB[v]+" blocs")).join("")}</div>`;
  if(st==="lieu") body=`<h1>Où es-tu ?</h1><div class="opts">${Object.entries(LIEUX).map(([v,l])=>opt("li",v,l,d.lieu)).join("")}</div><div id="surf"${d.lieu==="court"?"":" hidden"}><p class="msg">Surface</p><div class="chips">${Object.entries(SURF).map(([v,l])=>`<button type="button" class="tg" data-su="${v}" aria-pressed="${d.surface===v}">${l}</button>`).join("")}</div></div>`;
  if(st==="avec") body=`<h1>Avec qui ?</h1><div class="opts g3">${opt("nb","1","Seul",String(d.n>=3?3:d.n))}${opt("nb","2","À deux",String(d.n>=3?3:d.n))}${opt("nb","3","En groupe",String(d.n>=3?3:d.n))}</div>`;
  if(st==="mat") body=`<h1>Quel matériel as-tu ?</h1><p class="msg">Touche tout ce que tu as sous la main.</p><div class="chips mats">${MAT.map(([v,l])=>`<button type="button" class="tg" data-m="${v}" aria-pressed="${d.mat.includes(v)}">${l}</button>`).join("")}</div><div class="tools"><button class="ib sm" id="mnone" type="button">Rien du tout</button></div>`;
  if(st==="forme") body=`<h1>Comment tu te sens ?</h1><div class="opts g2">${Object.entries(FORME).map(([v,l])=>opt("fo",v,l,d.forme)).join("")}</div>
    <div id="zz"${d.forme==="douleur"?"":" hidden"}><p class="msg">Où ?</p><div class="chips">${Object.entries(ZN).map(([v,l])=>`<button type="button" class="tg" data-zo="${v}" aria-pressed="${d.zone===v}">${l}</button>`).join("")}</div></div>
    <p class="msg">Il fait :</p><div class="chips">${Object.entries(METEO).map(([v,l])=>`<button type="button" class="tg" data-me="${v}" aria-pressed="${d.meteo===v}">${l}</button>`).join("")}</div>
    ${d.apres==="match"?`<p class="msg">Temps entre la fin de l'échauffement et le match :</p><div class="chips">${[[0,"Tout de suite"],[5,"5 min"],[15,"15 min"],[30,"30 min et plus"]].map(([v,l])=>`<button type="button" class="tg" data-de="${v}" aria-pressed="${d.delai==v}">${l}</button>`).join("")}</div>`:""}`;
  main.innerHTML=`<div class="jwrap">${head}${body}${nav(k===JSTEPS.length-1?"Construire mon échauffement":"Suivant")}</div>`;
  const sel=(a,fn)=>$$(`[data-${a}]`).forEach(b=>b.onclick=()=>{ fn(b.dataset[a.replace(/-./g,x=>x[1].toUpperCase())]); $$(`[data-${a}]`).forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  sel("jid",v=>{ d.jids=v==="invite"?[]:[v]; $("#inv").hidden=v!=="invite"; if(v!=="invite"){ const j=J.find(x=>x.id===v); if(j){ d.age=ageAt(j.naissance)||d.age; d.sexe=j.sexe; } } });
  sel("ap",v=>d.apres=v); sel("du",v=>d.duree=+v); sel("li",v=>{ d.lieu=v; $("#surf").hidden=v!=="court"; }); sel("su",v=>d.surface=v); sel("nb",v=>d.n=+v);
  sel("fo",v=>{ d.forme=v; $("#zz").hidden=v!=="douleur"; }); sel("zo",v=>d.zone=v); sel("me",v=>d.meteo=v); sel("de",v=>d.delai=+v);
  $$("[data-m]").forEach(b=>b.onclick=()=>{ const m=b.dataset.m; d.mat=d.mat.includes(m)?d.mat.filter(x=>x!==m):[...d.mat,m]; b.setAttribute("aria-pressed",d.mat.includes(m)); });
  $("#mnone")&&($("#mnone").onclick=()=>{ d.mat=[]; $$("[data-m]").forEach(b=>b.setAttribute("aria-pressed",false)); });
  $("#ia")&&($("#ia").onchange=e=>d.age=Math.max(4,Math.min(18,+e.target.value||12)));
  $("#is")&&($("#is").onchange=e=>d.sexe=e.target.value);
  $("#nx").onclick=()=>{ if(k<JSTEPS.length-1) go("#j/"+(k+1)); else { finish(d); } };
}
function finish(d){
  d.blocks=blocsPour(d); ST.last={age:d.age,lieu:d.lieu,surface:d.surface}; ST.mat=d.mat;
  ST.cur=d; saveNow(); go("#r/cur");
}

/* ---------- MODE COACH : tout sur un écran ---------- */
function showCoach(){
  if(!DRAFT||DRAFT.mode!=="c") DRAFT=newDraft("c");
  const d=DRAFT, J=joueurs();
  const chips=(attr,obj,cur)=>`<div class="chips">${Object.entries(obj).map(([v,l])=>`<button type="button" class="tg" data-${attr}="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join("")}</div>`;
  main.innerHTML=`<div class="crumb"><a href="#">Accueil</a> › Coach</div><h1>Nouvelle routine</h1>
  <section class="sec step"><h2><b>1</b> Joueurs</h2><div class="card">
   ${J.length?`<div class="chips">${J.map(j=>`<button type="button" class="tg" data-j="${j.id}" aria-pressed="${d.jids.includes(j.id)}">${esc(j.nom)}${ageAt(j.naissance)!=null?" · "+ageAt(j.naissance)+" ans":""}</button>`).join("")}</div>`:""}
   <div class="row"><div class="f"><label for="cn">Nombre de joueurs</label><input type="number" id="cn" min="1" max="40" value="${d.n}"></div><div class="f"><label for="ca">Âge (le plus jeune)</label><input type="number" id="ca" min="4" max="18" value="${d.age}"></div></div>
   <p class="msg">Si tu coches des joueurs, l'âge, les zones fragiles et la croissance de leur profil sont pris en compte.</p></div></section>
  <section class="sec step"><h2><b>2</b> Ce qui suit et durée</h2><div class="card">${chips("ap",APRES,d.apres)}
   <div class="f"><label for="cs">Précision (facultatif)</label><input id="cs" value="${esc(d.sous)}" placeholder="Ex. tournoi, 1er tour ; PP collective ; tests de vitesse"></div>
   ${chips("du",Object.fromEntries(DUREES.map(v=>[v,v+" min"])),d.duree)}</div></section>
  <section class="sec step"><h2><b>3</b> Lieu et matériel</h2><div class="card">${chips("li",LIEUX,d.lieu)}<div id="surf"${d.lieu==="court"?"":" hidden"}>${chips("su",SURF,d.surface)}</div>
   <div class="f"><label>Matériel disponible</label><div class="chips">${MAT.map(([v,l])=>`<button type="button" class="tg sm" data-m="${v}" aria-pressed="${d.mat.includes(v)}">${l}</button>`).join("")}</div></div></div></section>
  <section class="sec step"><h2><b>4</b> Conditions du jour</h2><div class="card"><div class="f"><label>Météo</label>${chips("me",METEO,d.meteo)}</div><div class="f"><label>Forme</label>${chips("fo",FORME,d.forme)}</div>
   <div id="zz"${d.forme==="douleur"?"":" hidden"} class="f"><label>Zone</label>${chips("zo",ZN,d.zone)}</div>
   <div class="f"><label>Délai avant le match ou la séance</label>${chips("de",{0:"Tout de suite",5:"5 min",15:"15 min",30:"30 min et plus"},d.delai)}</div></div></section>
  <div class="tools bigact"><button class="go big" id="build" type="button">Construire la routine</button></div>`;
  const tog=(a,fn)=>$$(`[data-${a}]`).forEach(b=>b.onclick=()=>{ fn(b.dataset[a]); $$(`[data-${a}]`).forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  tog("ap",v=>d.apres=v); tog("du",v=>d.duree=+v); tog("li",v=>{ d.lieu=v; $("#surf").hidden=v!=="court"; }); tog("su",v=>d.surface=v);
  tog("me",v=>d.meteo=v); tog("fo",v=>{ d.forme=v; $("#zz").hidden=v!=="douleur"; }); tog("zo",v=>d.zone=v); tog("de",v=>d.delai=+v);
  $$("[data-j]").forEach(b=>b.onclick=()=>{ const j=b.dataset.j; d.jids=d.jids.includes(j)?d.jids.filter(x=>x!==j):[...d.jids,j]; b.setAttribute("aria-pressed",d.jids.includes(j)); if(d.jids.length>d.n){ d.n=d.jids.length; $("#cn").value=d.n; } });
  $$("[data-m]").forEach(b=>b.onclick=()=>{ const m=b.dataset.m; d.mat=d.mat.includes(m)?d.mat.filter(x=>x!==m):[...d.mat,m]; b.setAttribute("aria-pressed",d.mat.includes(m)); });
  $("#cn").onchange=e=>d.n=Math.max(1,+e.target.value||1); $("#ca").onchange=e=>d.age=Math.max(4,Math.min(18,+e.target.value||12)); $("#cs").oninput=e=>d.sous=e.target.value;
  $("#build").onclick=()=>finish(d);
}

/* ---------- LA ROUTINE ---------- */
const fsec=s=>{ s=Math.round(s/5)*5; return s>=60?(Math.floor(s/60)+" min"+(s%60?" "+(s%60):"")):s+" s"; };
function getR(id){ const r=id==="cur"?ST.cur:ST.routines.find(r=>r.id===id); if(r) migrate(r); return r; }
function showRoutine(id){
  const r=getR(id); if(!r){ go("#"); return; }
  const coach=r.mode==="c", tot=r.blocks.reduce((a,b)=>a+b.min,0), J=joueurs();
  const who=r.jids?.length?J.filter(j=>r.jids.includes(j.id)).map(j=>j.nom).join(", "):(r.recu?r.recu:(r.n>1?r.n+" joueurs":"Invité"))+" · "+r.age+" ans";
  const nJ=r.blocks.reduce((a,b)=>a+b.slots.length,0), done=r.blocks.every(b=>b.slots.every(s=>s.g));
  main.innerHTML=`<div class="crumb"><a href="#">Accueil</a> › Échauffement</div>
  <h1>${esc(r.nom||("Échauffement "+r.duree+" min"))}</h1>
  <p class="lead">${esc(who)} · avant ${esc(APRES[r.apres].toLowerCase())}${r.sous?" ("+esc(r.sous)+")":""} · ${LIEUX[r.lieu]}${r.lieu==="court"?" "+SURF[r.surface].toLowerCase():""} · ${METEO[r.meteo].toLowerCase()} · ${FORME[r.forme].toLowerCase()}${r.zone&&r.forme==="douleur"?" ("+ZN[r.zone].toLowerCase()+")":""}</p>
  ${r.meteo==="froid"?`<p class="note">Il fait froid : mise en route plus longue, garde ta veste les premières minutes.</p>`:""}
  ${r.delai>=15?`<p class="note">Ton match commence ${r.delai} min après : refais 2 min de mise en tension (sprints courts, frappes vives) juste avant d'entrer.</p>`:""}
  ${r.forme==="douleur"?`<p class="note">Petite douleur : les jeux qui sollicitent cette zone sont écartés. Si ça fait mal pendant l'échauffement, arrête et préviens ton coach.</p>`:""}
  <div class="tbar"><b>${tot} min</b> · ${r.blocks.length} blocs · ${nJ} jeux <button class="ib sm" id="sur" type="button">🎲 Surprends-moi</button></div>
  <p class="msg">Chaque bloc prépare tout ce qu'il doit préparer : un jeu par case, tu choisis lequel. Dans le mode guidé, les jeux de chaque bloc passent du plus doux au plus vif, avec quelques secondes pour te placer entre deux jeux.</p>
  <div class="blks">${r.blocks.map((b,i)=>{ const sec=gameSec(b); return `<div class="blk" style="--c:${ET[b.et].c}"><div class="bh"><span class="bn">${i+1}</span><div><b>${ET[b.et].n}${b.k>1?" ("+b.k+")":""}</b><small>${fmn(b.min)} · ${b.slots.length} jeu${b.slots.length>1?"x":""} de ${fsec(sec)}${b.slots.length>1?" + transitions":""}</small></div>${coach?`<span class="sp"></span><input type="number" class="nb" min="0.5" step="0.5" value="${b.min}" data-min="${i}" aria-label="Minutes"><button class="ib sm" data-del="${i}" aria-label="Retirer le bloc" type="button">×</button>`:""}</div>
    ${b.slots.map((s,j)=>{ const g=s.g&&G[s.g]; const lab=s.t.length===CIB[b.et].length&&s.t.length>1?"Tout le bloc":s.t.map(x=>CIBN[x]).join(" + ");
      return `<div class="slot"><span class="stl">${esc(lab)}</span>${g?`<button type="button" class="gsel" data-pick="${i}:${j}"><b>${esc(g.n)}</b><span>${esc(g.but)}</span></button>`:`<button type="button" class="go pick" data-pick="${i}:${j}">Choisir</button>`}</div>`; }).join("")}</div>`; }).join("")}</div>
  ${coach?`<div class="tools"><button class="ib" id="addb" type="button">+ Ajouter un bloc</button></div>`:""}
  <div class="tools bigact"><button class="go big" id="gostart" type="button" ${done?"":"disabled"}>${done?"C'est parti !":"Choisis un jeu dans chaque case"}</button></div>
  <div class="tools"><button class="ib" id="save" type="button">${id==="cur"?"Enregistrer cette routine":"Renommer"}</button><button class="ib" id="snd" type="button">📲 Envoyer au joueur</button><button class="ib" id="pdf" type="button">PDF / partager</button>${id!=="cur"?`<button class="ib" id="dup" type="button">Refaire avec d'autres jeux</button><button class="ib" id="del" type="button">Supprimer</button>`:""}</div>`;
  const store=()=>{ r.maj=todayIso(); saveNow(); };
  const resum=()=>{ r.duree=Math.round(r.blocks.reduce((a,b)=>a+b.min,0)); };
  $$("[data-pick]").forEach(b=>b.onclick=()=>{ const [i,j]=b.dataset.pick.split(":").map(Number); picker(r,i,j,id); });
  $("#sur").onclick=()=>{ surprise(r,false); store(); showRoutine(id); };
  $$("[data-min]").forEach(x=>x.onchange=()=>{ const b=r.blocks[+x.dataset.min]; b.min=Math.max(0.5,+x.value||1); b.slots=slotsPour(b,r); resum(); store(); showRoutine(id); });
  $$("[data-del]").forEach(x=>x.onclick=()=>{ r.blocks.splice(+x.dataset.del,1); resum(); store(); showRoutine(id); });
  $("#addb")&&($("#addb").onclick=()=>{ openSheet(`<div class="shh"><b>Ajouter un bloc</b><button class="ib" data-close type="button">×</button></div><div class="opts">${ORD.map(e=>`<button type="button" class="opt" data-ae="${e}"><b>${ET[e].n}</b></button>`).join("")}</div>`); $$("[data-ae]",sheet).forEach(x=>x.onclick=()=>{ const e=x.dataset.ae; const at=r.blocks.findIndex(b=>ORD.indexOf(b.et)>ORD.indexOf(e)); const nb={et:e,k:1+r.blocks.filter(b=>b.et===e).length,min:3}; nb.slots=slotsPour(nb,r); if(at<0) r.blocks.push(nb); else r.blocks.splice(at,0,nb); resum(); closeSheet(); store(); showRoutine(id); }); });
  $("#gostart").onclick=()=>{ if(!done) return; go("#g/"+id+"/0"); };
  $("#save").onclick=()=>{ openSheet(`<div class="shh"><b>${id==="cur"?"Enregistrer":"Renommer"}</b><button class="ib" data-close type="button">×</button></div><input class="srch" id="rn" value="${esc(r.nom||("Mon échauffement "+r.duree+" min avant "+APRES[r.apres].toLowerCase()))}"><div class="tools"><button class="go" id="rok" type="button">OK</button></div>`);
    $("#rok").onclick=()=>{ r.nom=$("#rn").value.trim(); if(id==="cur"){ const c=JSON.parse(JSON.stringify(r)); c.id=uid(); c.maj=todayIso(); ST.routines.push(c); saveNow(); closeSheet(); go("#r/"+c.id); } else { store(); closeSheet(); showRoutine(id); } }; };
  $("#pdf").onclick=()=>pdfRoutine(r);
  $("#snd").onclick=()=>envoyer(r);
  $("#dup")&&($("#dup").onclick=()=>{ const c=JSON.parse(JSON.stringify(r)); c.id="cur"; c.nom=""; surprise(c,false); ST.cur=c; saveNow(); go("#r/cur"); });
  $("#del")&&($("#del").onclick=()=>{ const b=$("#del"); if(!b.dataset.ok){ b.dataset.ok=1; b.textContent="Confirmer"; return; } ST.routines=ST.routines.filter(x=>x.id!==id); saveNow(); go("#"); });
}
function picker(r,i,j,rid){
  const b=r.blocks[i], s=b.slots[j], used=new Set(allG(r).filter(x=>x!==s.g));
  const C=candidats(r,b,s,used).filter(x=>!x.used); let q="", shown=30;
  const lab=s.t.length===CIB[b.et].length&&s.t.length>1?"tout le bloc":s.t.map(x=>CIBN[x]).join(" + ");
  openSheet(`<div class="shh"><b>${ET[b.et].n} · ${esc(lab)}</b><button class="ib" data-close type="button" aria-label="Fermer">×</button></div>
   <p class="msg">${C.length} jeux possibles · ${fsec(gameSec(b))}. Touche celui que tu veux faire.</p>
   <div class="tools"><button class="ib" id="one" type="button">🎲 Choisis pour moi</button></div>
   <input class="srch" id="pq" type="search" placeholder="Chercher un jeu"><div id="pl"></div>`);
  const draw=()=>{ const qq=norm(q); const L=C.filter(x=>!qq||norm(x.g.n+" "+x.g.but).includes(qq));
    const item=x=>`<div class="pit"><button type="button" class="padd" data-g="${x.g.id}"><b>${ST.fav.includes(x.g.id)?"♥ ":""}${x.g.complet?"⭐ ":""}${esc(x.g.n)}</b><span>${esc(x.g.but)}</span><small>${(x.g.ci||[]).map(c=>CIBN[c]).join(", ")}${x.g.complet?" (circuit complet)":""} · ${x.g.mat.length?x.g.mat.map(m=>MATN[m]||m).join(", "):"sans matériel"}${x.last?" · fait le "+frD(x.last):""}</small></button><button type="button" class="ib sm" data-inf="${x.g.id}" aria-label="Voir la fiche">ⓘ</button>${r.mode==="c"?`<button type="button" class="ib sm${ST.fav.includes(x.g.id)?" on":""}" data-fv="${x.g.id}" aria-label="Coup de cœur">♥</button><button type="button" class="ib sm" data-hd="${x.g.id}" aria-label="Masquer ce jeu">🚫</button>`:""}</div>`;
    $("#pl").innerHTML=!L.length?`<div class="empty">Aucun jeu avec ces réglages : ajoute du matériel ou change de lieu.</div>`:(q?L.slice(0,shown).map(item).join(""):`<h3 class="alt">Les plus adaptés</h3>${L.slice(0,10).map(item).join("")}${L.length>10?`<h3 class="alt">Tous les autres (${L.length-10})</h3>${L.slice(10,shown).map(item).join("")}`:""}`)+(L.length>shown?`<button class="ib" id="more" type="button">Voir plus</button>`:"");
    $("#more")&&($("#more").onclick=()=>{ shown+=40; draw(); });
    $$("[data-fv]",sheet).forEach(x=>x.onclick=()=>{ const id=x.dataset.fv; ST.fav=ST.fav.includes(id)?ST.fav.filter(y=>y!==id):[...ST.fav,id]; saveNow(); x.classList.toggle("on",ST.fav.includes(id)); });
    $$("[data-hd]",sheet).forEach(x=>x.onclick=()=>{ const id=x.dataset.hd; if(!ST.hide.includes(id)) ST.hide.push(id); saveNow(); const k=C.findIndex(y=>y.g.id===id); if(k>=0) C.splice(k,1); draw(); });
    $$("[data-g]",sheet).forEach(x=>x.onclick=()=>{ s.g=x.dataset.g; r.maj=todayIso(); saveNow(); closeSheet(); showRoutine(rid); });
    $$("[data-inf]",sheet).forEach(x=>x.onclick=()=>fiche(x.dataset.inf,()=>picker(r,i,j,rid),()=>{ s.g=x.dataset.inf; saveNow(); closeSheet(); showRoutine(rid); }));
  };
  $("#one").onclick=()=>{ const top=C.slice(0,8); if(!top.length) return; s.g=top[Math.floor(Math.random()*top.length)].g.id; saveNow(); closeSheet(); showRoutine(rid); };
  $("#pq").oninput=e=>{ q=e.target.value; draw(); }; draw();
}

/* ---------- fiche + vidéo (banque) ---------- */
let VIDL=null;
async function videoOf(id){
  try{ const db=await new Promise((ok,ko)=>{ const q=indexedDB.open("banque_videos",1); q.onupgradeneeded=()=>q.result.createObjectStore("v"); q.onsuccess=()=>ok(q.result); q.onerror=()=>ko(); });
    const blob=await new Promise(ok=>{ const t=db.transaction("v").objectStore("v").get(id); t.onsuccess=()=>ok(t.result); t.onerror=()=>ok(null); }); if(blob) return {u:URL.createObjectURL(blob)}; }catch(e){}
  try{ if(!VIDL) VIDL=await (await fetch("../Banque-/videos.json",{cache:"no-store"})).json(); if(VIDL?.[id]) return {l:VIDL[id]}; }catch(e){ VIDL={}; }
  try{ const bl=load("banque_v1",{}).links||{}; if(bl[id]) return {l:bl[id]}; }catch(e){}
  return null;
}
function vidHtml(v){ if(!v) return ""; if(v.u) return `<video src="${v.u}" controls playsinline loop style="width:100%;border-radius:12px;max-height:46vh;background:#000"></video>`; return `<p><a class="ib" href="${esc(v.l)}" target="_blank" rel="noopener">▶ Voir la vidéo</a></p>`; }
function ficheHtml(g){ return `<p class="but">${esc(g.but)}</p><p>${esc(g.de)}</p>${g.co?.length?`<ul class="cos">${g.co.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}${g.va?`<p class="msg">${esc(g.va)}</p>`:""}<p class="msg">${g.mat.length?"Matériel : "+g.mat.map(m=>MATN[m]||m).join(", "):"Sans matériel"} · ${g.fmt.map(f=>({seul:"seul",deux:"à deux",groupe:"en groupe"})[f]).join(" / ")} · ${g.a[0]}-${g.a[1]} ans</p>`; }
function fiche(id,back,choose){
  const g=G[id]; if(!g) return;
  openSheet(`<div class="shh"><b>${esc(g.n)}</b><button class="ib" data-close type="button">×</button></div><div id="vid"></div>${ficheHtml(g)}
   <div class="tools">${choose?`<button class="go" id="fch" type="button">Je prends ce jeu</button>`:""}${back?`<button class="ib" id="fbk" type="button">‹ Retour à la liste</button>`:""}</div>`);
  back&&($("#fbk").onclick=back); choose&&($("#fch").onclick=choose);
  videoOf(id).then(v=>{ const el=$("#vid"); if(el) el.innerHTML=vidHtml(v); });
}

/* ---------- MODE GUIDÉ : chaque jeu de chaque bloc, avec son chrono ---------- */
let TIMER=null, ACX=null;
function beep(){ try{ ACX ||= new (window.AudioContext||window.webkitAudioContext)(); [0,0.25,0.5].forEach(t=>{ const o=ACX.createOscillator(), g=ACX.createGain(); o.frequency.value=t<0.5?880:1320; o.connect(g); g.connect(ACX.destination); g.gain.setValueAtTime(0.25,ACX.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001,ACX.currentTime+t+0.2); o.start(ACX.currentTime+t); o.stop(ACX.currentTime+t+0.22); }); }catch(e){} if(navigator.vibrate) navigator.vibrate([200,100,200]); }
const TR=10, TRM=20;
function gameSec(b){ const n=b.slots.length; return Math.max(15,Math.round((b.min*60-(n-1)*TR)/n)); }
function steps(r){
  const S=[]; let prev=null;
  r.blocks.forEach((b,i)=>{ const order=b.slots.map((s,j)=>({s,j})).sort((x,y)=>((G[x.s.g]?.int||2)-(G[y.s.g]?.int||2))||(x.j-y.j));
    const gsec=gameSec(b);
    order.forEach(({s,j},m)=>{ const g=G[s.g];
      if(prev){ const newMat=(g?.mat||[]).filter(x=>!(G[prev]?.mat||[]).includes(x)); S.push({tr:true,b,s,sec:newMat.length?TRM:TR,newMat}); }
      S.push({b,i,s,j:m,sec:gsec}); prev=s.g; }); });
  return S;
}
let AUTO=true;
function showGuide(id,k){
  const r=getR(id); if(!r){ go("#"); return; } k=+k||0; clearInterval(TIMER);
  const S=steps(r); if(k>=S.length){ endRoutine(r,id); return; }
  const x=S[k], b=x.b, g=G[x.s.g]; let left=x.sec;
  const games=S.filter(y=>!y.tr), gi=S.slice(0,k+1).filter(y=>!y.tr).length;
  const nx=S.slice(k+1).find(y=>!y.tr);
  const bar=`<div class="gbar">${games.map((y,m)=>`<i style="background:${m<gi?ET[y.b.et].c:"var(--line)"}"></i>`).join("")}</div>`;
  if(x.tr){
    main.innerHTML=`<div class="ter" style="--c:${ET[b.et].c}"><div class="terh"><a class="ib" href="#r/${id}">Quitter</a><span>Place-toi</span></div>${bar}
     <div class="etq">Prochain jeu · ${ET[b.et].n}</div><h1>${esc(g?.n||"")}</h1><div class="clock" id="clk"></div>
     <p class="lead">${x.newMat.length?"Prépare : "+x.newMat.map(m=>MATN[m]||m).join(", ")+".":"Reprends ton souffle et place-toi."}</p>
     <div class="tools"><a class="go big" href="#g/${id}/${k+1}">J'y suis</a></div><div class="terx">${g?`<p class="but">${esc(g.but)}</p><p>${esc(g.de)}</p>`:""}</div></div>`;
  } else {
  main.innerHTML=`<div class="ter" style="--c:${ET[b.et].c}"><div class="terh"><a class="ib" href="#r/${id}">Quitter</a><span>Jeu ${gi}/${games.length}</span></div>${bar}
   <div class="etq">${ET[b.et].n} · ${x.j+1}/${b.slots.length}</div><h1>${esc(g?.n||"")}</h1>
   <div class="clock" id="clk"></div>
   <div class="tools"><button class="go big" id="st" type="button">${k===0?"Démarrer":"Pause"}</button><a class="ib" href="#g/${id}/${k+1}">${nx?"Suivant ›":"Terminer"}</a></div>
   <label class="chk"><input type="checkbox" id="auto"${AUTO?" checked":""}> Enchaîner tout seul</label>
   <p class="msg">Joue pendant le temps du chrono : si la fiche parle d'un nombre de passages, adapte-le.</p>
   <div id="vid"></div><div class="terx">${g?ficheHtml(g):""}</div>
   ${nx?`<p class="msg">Ensuite : ${ET[nx.b.et].n} · ${esc(G[nx.s.g]?.n||"")}</p>`:""}</div>`;
  }
  const show=()=>{ const m=Math.floor(Math.abs(left)/60), s=Math.abs(left)%60; $("#clk").textContent=(left<0?"+":"")+m+":"+String(s).padStart(2,"0"); $("#clk").classList.toggle("over",left<0); };
  let run=false;
  const start=()=>{ run=true; $("#st")&&($("#st").textContent="Pause"); clearInterval(TIMER); TIMER=setInterval(()=>{ left--; show(); if(left===0){ if(!x.tr) beep(); if(AUTO||x.tr){ clearInterval(TIMER); setTimeout(()=>go("#g/"+id+"/"+(k+1)),x.tr?200:1200); } } },1000); };
  show();
  $("#auto")&&($("#auto").onchange=e=>AUTO=e.target.checked);
  $("#st")&&($("#st").onclick=()=>{ try{ ACX ||= new (window.AudioContext||window.webkitAudioContext)(); ACX.resume(); }catch(e){} if(run){ run=false; clearInterval(TIMER); $("#st").textContent="Reprendre"; } else start(); });
  if(x.tr || (k>0 && AUTO)) start();
  if(g && !x.tr) videoOf(g.id).then(v=>{ const el=$("#vid"); if(el) el.innerHTML=vidHtml(v); });
}

/* ---------- ENVOYER AU JOUEUR : la routine voyage dans un lien ---------- */
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))));
async function envoyer(r){
  const J=joueurs(); const nm=r.jids?.length?J.filter(j=>r.jids.includes(j.id)).map(j=>j.nom.split(" ")[0]).join(", "):"";
  const p={v:1,nm,nom:r.nom||"",ag:r.age,ap:r.apres,so:r.sous||"",du:r.duree,li:r.lieu,su:r.surface,n:r.n,me:r.meteo,fo:r.forme,zo:r.zone||"",de:r.delai||0,mat:r.mat,b:r.blocks.map(b=>[b.et,b.k||1,b.min,b.slots.map(s=>[s.t,s.g||""])])};
  const url=location.origin+location.pathname+"#x/"+b64e(JSON.stringify(p));
  const msg=`Ton échauffement ${r.duree} min${nm?" ("+nm+")":""} : ouvre ce lien, puis « C'est parti ! »`;
  try{ if(navigator.share){ await navigator.share({title:"Échauffement",text:msg,url}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(url); }catch(e){}
  openSheet(`<div class="shh"><b>Envoyer au joueur</b><button class="ib" data-close type="button">×</button></div><p class="msg">Lien copié. Colle-le dans un message à ton joueur : il ouvre l'échauffement directement sur son téléphone.</p><textarea class="srch" rows="4" readonly>${esc(url)}</textarea>`);
}
function recevoir(code){
  try{ const p=JSON.parse(b64d(code));
    const r={id:"cur",mode:"j",recu:p.nm||"",nom:p.nom||(p.nm?"Échauffement préparé pour "+p.nm:""),date:todayIso(),jids:[],age:p.ag,sexe:"F",apres:p.ap,sous:p.so,duree:p.du,lieu:p.li,surface:p.su||"dur",n:p.n||1,mat:p.mat||[],meteo:p.me||"normal",forme:p.fo||"frais",zone:p.zo||"",delai:p.de||0,
      blocks:p.b.map(([et,k,min,sl])=>({et,k,min,slots:sl.map(([t,g])=>({t,g:G[g]?g:null}))}))};
    ST.cur=r; saveNow(); location.replace("#r/cur");
  }catch(e){ main.innerHTML=`<div class="empty">Ce lien d'échauffement est abîmé. Demande à ton coach de te le renvoyer.</div>`; }
}

/* ---------- MES JEUX : coups de cœur et jeux masqués ---------- */
function showMesJeux(){
  const row=(id,act,lab)=>{ const g=G[id]; return g?`<div class="li"><span class="code">${ET[g.et].n.split(" ")[0]}</span><span class="tt">${esc(g.n)}<small>${esc(g.but)}</small></span><button class="ib sm" type="button" data-${act}="${id}">${lab}</button></div>`:""; };
  main.innerHTML=`<div class="crumb"><a href="#">Accueil</a> › Mes jeux</div><h1>Mes jeux</h1>
  <p class="lead">En mode coach, dans la liste d'un bloc : ♥ pour un coup de cœur (proposé en premier), 🚫 pour masquer un jeu (plus jamais proposé).</p>
  <section class="sec"><h2>Coups de cœur (${ST.fav.length})</h2>${ST.fav.length?`<div class="list">${ST.fav.map(id=>row(id,"uf","Retirer")).join("")}</div>`:`<div class="empty">Aucun.</div>`}</section>
  <section class="sec"><h2>Jeux masqués (${ST.hide.length})</h2>${ST.hide.length?`<div class="list">${ST.hide.map(id=>row(id,"uh","Réafficher")).join("")}</div>`:`<div class="empty">Aucun.</div>`}</section>`;
  $$("[data-uf]").forEach(b=>b.onclick=()=>{ ST.fav=ST.fav.filter(x=>x!==b.dataset.uf); saveNow(); showMesJeux(); });
  $$("[data-uh]").forEach(b=>b.onclick=()=>{ ST.hide=ST.hide.filter(x=>x!==b.dataset.uh); saveNow(); showMesJeux(); });
}
function endRoutine(r,id){
  const who=r.jids?.length?r.jids:["invite"];
  for(const w of who) ST.hist.push({who:w,date:todayIso(),duree:r.duree,apres:r.apres,g:allG(r)});
  if(ST.hist.length>2000) ST.hist=ST.hist.slice(-2000); saveNow();
  main.innerHTML=`<div class="ter fin"><h1>Échauffement terminé 💪</h1><p class="lead">${r.blocks.length} blocs, ${allG(r).length} jeux, ${r.duree} min. ${r.apres==="match"?(r.delai>=15?"Refais 2 min de mise en tension juste avant d'entrer sur le court. ":"")+"Bon match !":"Bonne séance !"}</p>
   <div class="tools bigact"><a class="go big" href="#">Accueil</a>${id==="cur"?`<button class="ib" id="sv" type="button">Enregistrer cette routine</button>`:""}</div></div>`;
  $("#sv")&&($("#sv").onclick=()=>{ const c=JSON.parse(JSON.stringify(r)); c.id=uid(); c.nom=c.nom||("Mon échauffement "+r.duree+" min avant "+APRES[r.apres].toLowerCase()); c.maj=todayIso(); ST.routines.push(c); saveNow(); go("#r/"+c.id); });
}

/* ---------- PDF ---------- */
async function pdfRoutine(r){
  const btn=$("#pdf"); btn.textContent="Préparation…";
  try{ const d=new MiniPDF.Doc(), M=d.M, W=d.W-2*M;
    d.para(r.nom||("Échauffement "+r.duree+" min"),{size:18,bold:true,after:4});
    d.para(`Avant : ${APRES[r.apres]}${r.sous?" ("+r.sous+")":""} · ${r.duree} min · ${LIEUX[r.lieu]} · ${METEO[r.meteo]} · ${FORME[r.forme]}`,{size:10,color:"#5D6675",after:10});
    r.blocks.forEach((b,i)=>{ d.need(60); d.rect(M,d.y,W,18,{fill:ET[b.et].c}); d.text(M+8,d.y+4,`${i+1}. ${ET[b.et].n}`,{size:11,bold:true,color:"#FFFFFF"}); const mn=fmn(b.min)+" · "+b.slots.length+" jeux"; d.text(M+W-8-MiniPDF.width(mn,11,true),d.y+4,mn,{size:11,bold:true,color:"#FFFFFF"}); d.y+=24;
      b.slots.forEach(s=>{ const g=G[s.g]; const lab=s.t.map(x=>CIBN[x]).join(" + ");
        if(g){ d.need(40); d.para(`${g.n}  (${fsec(gameSec(b))} · ${lab})`,{size:11,bold:true,after:1}); d.para(g.de,{size:9.5,after:1}); (g.co||[]).forEach(c=>d.para("• "+c,{size:9,x:M+6,after:0})); d.y+=5; }
        else d.para(lab+" : (jeu à choisir)",{size:9.5,color:"#8A94A3"}); });
      d.y+=6; });
    const res=await MiniPDF.deliver(d.out(),`Echauffement ${r.duree} min ${todayIso()}.pdf`); btn.textContent=res==="download"?"PDF téléchargé":"PDF / partager";
  }catch(e){ btn.textContent="Erreur PDF"; }
  setTimeout(()=>{ const x=$("#pdf"); if(x) x.textContent="PDF / partager"; },2500);
}

/* ---------- ROUTAGE ---------- */
function route(){
  clearInterval(TIMER); closeSheet();
  const [a,b,c]=location.hash.slice(1).split("/").map(decodeURIComponent);
  document.body.classList.toggle("terrain",a==="g");
  if(a==="x"&&b) recevoir(b); else if(a==="m") showMesJeux(); else if(a==="j") showJoueur(b); else if(a==="c") showCoach(); else if(a==="r"&&b) showRoutine(b); else if(a==="g"&&b) showGuide(b,c); else showHome();
  scrollTo(0,0); $("#back").style.visibility=a?"visible":"hidden";
}
addEventListener("hashchange",route);
async function boot(){
  try{ const r = await fetch("data.json"); const d = await r.json(); DATA=d; for(const g of DATA.g) G[g.id]=g; route(); }
  catch(e){ main.innerHTML=`<div class="empty">Impossible de charger les jeux. Ouvre l'appli une fois avec une connexion.</div>`; }
}
boot();
